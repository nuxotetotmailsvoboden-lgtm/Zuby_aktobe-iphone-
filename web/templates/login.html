<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growth Bot - Вход</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center">🚀 Growth Bot PRO</h2>
        <p class="text-gray-500 text-center mb-6">Вход в панель администратора</p>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Логин</label>
                <input type="text" id="username" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
                <input type="password" id="password" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">Войти</button>
        </form>
        <p id="errorMsg" class="text-red-500 text-sm text-center mt-4 hidden"></p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const response = await fetch('/admin/stats', {
                headers: {
                    'Authorization': 'Basic ' + btoa(username + ':' + password)
                }
            });

            if (response.ok) {
                localStorage.setItem('auth', btoa(username + ':' + password));
                window.location.href = '/dashboard';
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
                document.getElementById('errorMsg').innerText = 'Неверный логин или пароль';
            }
        });

        // Если уже авторизованы, редирект
        const auth = localStorage.getItem('auth');
        if (auth) {
            fetch('/admin/stats', {
                headers: { 'Authorization': 'Basic ' + auth }
            }).then(r => {
                if (r.ok) window.location.href = '/dashboard';
                else localStorage.removeItem('auth');
            });
        }
    </script>
</body>
</html>
