<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growth Bot Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-800">🚀 Growth Bot PRO</h1>
            <div>
                <a href="/dashboard" class="text-blue-600 mr-4">Дашборд</a>
                <a href="/export/users" class="text-blue-600 mr-4">Экспорт CSV</a>
                <a href="/logout" class="text-red-600">Выйти</a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-4">
        <!-- Карточки статистики -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded shadow">
                <div class="text-gray-500 text-sm">Всего пользователей</div>
                <div class="text-2xl font-bold" id="totalUsers">-</div>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <div class="text-gray-500 text-sm">Бизнесов</div>
                <div class="text-2xl font-bold" id="totalBusinesses">-</div>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <div class="text-gray-500 text-sm">Записей</div>
                <div class="text-2xl font-bold" id="totalBookings">-</div>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <div class="text-gray-500 text-sm">Доход (₸)</div>
                <div class="text-2xl font-bold" id="totalRevenue">-</div>
            </div>
        </div>

        <!-- Графики -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
            <div class="bg-white p-4 rounded shadow">
                <h2 class="text-lg font-semibold mb-2">Регистрации по дням</h2>
                <div id="registrationsChart" style="height: 300px;"></div>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <h2 class="text-lg font-semibold mb-2">Активность (баллы)</h2>
                <div id="activityChart" style="height: 300px;"></div>
            </div>
        </div>

        <!-- Таблица последних пользователей -->
        <div class="bg-white p-4 rounded shadow">
            <h2 class="text-lg font-semibold mb-4">Последние пользователи</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full table-auto">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-2 text-left">ID</th>
                            <th class="px-4 py-2 text-left">Имя</th>
                            <th class="px-4 py-2 text-left">Username</th>
                            <th class="px-4 py-2 text-left">Телефон</th>
                            <th class="px-4 py-2 text-left">Баллы</th>
                            <th class="px-4 py-2 text-left">Дата регистрации</th>
                        </tr>
                    </thead>
                    <tbody id="recentUsersBody">
                        <tr><td colspan="6" class="text-center py-4">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadDashboard() {
            try {
                const statsRes = await fetch('/admin/stats');
                const stats = await statsRes.json();
                document.getElementById('totalUsers').innerText = stats.total_users || 0;
                document.getElementById('totalBusinesses').innerText = stats.total_businesses || 0;
                document.getElementById('totalBookings').innerText = stats.total_bookings || 0;
                document.getElementById('totalRevenue').innerText = (stats.total_revenue || 0).toLocaleString();
            } catch(e) {
                console.error('Stats error:', e);
            }

            try {
                const regRes = await fetch('/analytics/registrations');
                const regData = await regRes.json();
                Plotly.newPlot('registrationsChart', [{
                    x: regData.dates,
                    y: regData.counts,
                    type: 'scatter',
                    mode: 'lines+markers',
                    marker: {color: '#3b82f6'}
                }], {margin: {t: 10, r: 10, l: 40, b: 40}});
            } catch(e) {
                console.error('Reg chart error:', e);
            }

            try {
                const actRes = await fetch('/analytics/activity');
                const actData = await actRes.json();
                Plotly.newPlot('activityChart', [{
                    x: actData.dates,
                    y: actData.points,
                    type: 'bar',
                    marker: {color: '#10b981'}
                }], {margin: {t: 10, r: 10, l: 40, b: 40}});
            } catch(e) {
                console.error('Activity chart error:', e);
            }

            try {
                const usersRes = await fetch('/admin/recent_users');
                const users = await usersRes.json();
                const tbody = document.getElementById('recentUsersBody');
                tbody.innerHTML = '';
                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4">Нет данных</td></tr>';
                } else {
                    users.forEach(u => {
                        const row = document.createElement('tr');
                        row.className = 'border-t';
                        row.innerHTML = `
                            <td class="px-4 py-2">${u.id}</td>
                            <td class="px-4 py-2">${u.full_name || '-'}</td>
                            <td class="px-4 py-2">${u.username || '-'}</td>
                            <td class="px-4 py-2">${u.phone || '-'}</td>
                            <td class="px-4 py-2">${u.points}</td>
                            <td class="px-4 py-2">${u.registered_at ? new Date(u.registered_at).toLocaleString() : '-'}</td>
                        `;
                        tbody.appendChild(row);
                    });
                }
            } catch(e) {
                console.error('Users error:', e);
            }
        }

        loadDashboard();
    </script>
</body>
</html>
